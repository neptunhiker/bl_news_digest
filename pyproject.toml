[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bl-news-digest"
version = "0.1.0"
description = "BeginnerLuft AVGS External News Digest - daily Slack pipeline"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "feedparser>=6.0",
    "httpx>=0.27",
    "openai>=1.30",
    "orjson>=3.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "slack-sdk>=3.27",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "respx>=0.21",
    "pytest-anyio>=0.0.0",
]

[project.scripts]
bl-news-digest = "bl_news_digest.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
